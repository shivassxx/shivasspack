name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shivasspack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shivasspack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral CI service credentials, never production secrets.
      DATABASE_ADMIN_URL: postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/shivasspack_test
      DATABASE_URL: postgresql://shivass_app:ci-app-only-00000000000000000000000000000000@127.0.0.1:5432/shivasspack_test
      DATABASE_MIGRATION_URL: postgresql://shivass_migrator:ci-migration-only-00000000000000000000000000@127.0.0.1:5432/shivasspack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run db:provision
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed -- --demo
      - run: npm run db:test
